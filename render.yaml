# =========================================================
# Render.com Blueprint Infrastructure Specification
# Multi-Container Docker Deployment for BookMyTicket
# =========================================================

services:
  # ---------------------------------------------------------
  # 1. Spring Boot Backend Service (Docker Container)
  # ---------------------------------------------------------
  - type: web
    name: bookmyticket-backend
    env: docker
    region: singapore
    plan: free
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /api/movies
    envVars:
      - key: PORT
        value: 8080
      - key: SPRING_DATASOURCE_URL
        value: jdbc:mysql://YOUR_MYSQL_HOST:3306/movieticket?useSSL=false&allowPublicKeyRetrieval=true
      - key: SPRING_DATASOURCE_USERNAME
        value: root
      - key: SPRING_DATASOURCE_PASSWORD
        value: Nitin@2004
      - key: TMDB_API_KEY
        value: e01d0966ebcead42f3a3bec84c24b41d
      - key: RAZORPAY_KEY_ID
        value: rzp_test_TJJY5Q4lsHDjQL
      - key: RAZORPAY_KEY_SECRET
        value: wcoypHqN2jd0V23A5y3dweV8

  # ---------------------------------------------------------
  # 2. React + Vite Frontend Service (Docker + Nginx)
  # ---------------------------------------------------------
  - type: web
    name: bookmyticket-frontend
    env: docker
    region: singapore
    plan: free
    dockerContext: ./frontend
    dockerfilePath: ./frontend/Dockerfile
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: bookmyticket-backend
          property: url
